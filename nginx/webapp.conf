server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /controle-patrimonio {
        return 308 /controle-patrimonio/;
    }

    location ^~ /controle-patrimonio/api/ {
        client_max_body_size 20m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Shell offline: o navegador precisa revalidar o service worker para atualizar.
    location ~ ^/controle-patrimonio/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /controle-patrimonio/ {
        try_files $uri $uri/ /controle-patrimonio/index.html;
    }
}
