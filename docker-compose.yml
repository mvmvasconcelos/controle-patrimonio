version: '3.8'

services:
  flutter:
    build:
      context: .
      target: flutter-sdk
    container_name: controle-patrimonio-flutter
    working_dir: /app
    volumes:
      - ./:/app:cached
      - pub_cache:/root/.pub-cache
    ports:
      - "8092:8090"
    environment:
      TERM: xterm
    stdin_open: true
    tty: true
    # Manter container vivo para execução de comandos
    command: ["sh", "-c", "tail -f /dev/null"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build: ./backend
    container_name: controle-patrimonio-backend
    working_dir: /backend
    volumes:
      - ./backend:/backend
      - backend_data:/backend/data
    ports:
      - "6090:8000"
    environment:
      PYTHONUNBUFFERED: 1
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pub_cache:
  backend_data:
