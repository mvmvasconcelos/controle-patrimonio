name: controle_patrimonio
description: Minimal Flutter app for controle-patrimonio
publish_to: none
version: 1.0.3+67
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  
  # Network & HTTP
  http: ^1.2.0
  http_parser: ^4.0.2
  connectivity_plus: ^6.0.0
  
  # Browser offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Browser camera and file handling
  mobile_scanner: ^5.0.0
  audioplayers: ^6.0.0
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  # win32 5.5.0 usa UnmodifiableUint8ListView removido no Dart 3.3+
  # win32 5.13.0 corrigiu o problema mantendo compatibilidade com meta 1.16.0
  win32: ^5.13.0

flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - assets/sounds/beep.mp3
    - assets/branding/logo.png
